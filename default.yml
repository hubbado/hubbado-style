require:
  - hubbado/style

AllCops:
  Include:
    - '**/*.rb'
    - Rakefile
    - config.ru
  Exclude:
    - gems/**/*
    - db/**
    - config/**
    - script/**
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

# All spec files are basically one giant module
# Sometimes we include the spec in a module, as RSpec doesn't support include properly
Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

# We will use our own judgement here
Naming/AccessorMethodName:
  Enabled: false

Naming/BlockForwarding:
  EnforcedStyle: explicit

Naming/PredicatePrefix:
  ForbiddenPrefixes:
    - is_

# We will use our own judgement here
Naming/VariableNumber:
  Enabled: false

Style/AccessorGrouping:
  Enabled: false

# We will use our own judgement here
Style/Alias:
  Enabled: false

Style/ArgumentsForwarding:
  UseAnonymousForwarding: false

Style/BlockDelimiters:
  EnforcedStyle: line_count_based
  Exclude:
    - 'spec/**/*'

Style/Documentation:
  Enabled: false

# One-liner `Foo = Class.new(Bar)` is preferred for empty exception classes
Style/EmptyClassDefinition:
  Enabled: false

# This gets it wrong when we want to divide money by money as floats
Style/FloatDivision:
  Enabled: false

# Gets confused with %{first} in YAML strings in tests
Style/FormatStringToken:
  Exclude:
    - 'spec/**/*'

Style/FrozenStringLiteralComment:
  Enabled: false

# Unnecessary {} when this is enabled
Style/HashAsLastArrayItem:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: either_consistent

Style/IfUnlessModifier:
  Enabled: false

Style/Lambda:
  Enabled: false

Style/LambdaCall:
  Enabled: false

Style/NestedParenthesizedCalls:
  Enabled: false

# We don't consider .positive? etc to be that readable
Style/NumericPredicate:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/BlockEndNewline:
  Enabled: false

Layout/CaseIndentation:
  IndentOneStep: true

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/MultilineBlockLayout:
  Exclude:
    - 'spec/**/*'

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented
  IndentationWidth: 2

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/LineLength:
  Max: 100

# Disabled so that we can write .to_not change { } in Rspec
Lint/AmbiguousBlockAssociation:
  Exclude:
    - 'spec/**/*'

# We know mathematical precedence so this is unnecessary
Lint/AmbiguousOperatorPrecedence:
  Enabled: false

# Constants have to be created and assigned in RSpec blocks
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

Lint/UnusedMethodArgument:
  Enabled: false

Hubbado/UnusedMethodArgument:
  Enabled: true
  Severity: warning
  AutoCorrect: false
  AllowUnusedKeywordArguments: false
  IgnoreEmptyMethods: true
  IgnoreNotImplementedMethods: true
  NotImplementedExceptions:
    - NotImplementedError

Lint/UselessAccessModifier:
  MethodCreatingMethods:
    - delegate

Style/AsciiComments:
  Enabled: false

Style/AndOr:
  EnforcedStyle: conditionals

Style/ClassAndModuleChildren:
  Enabled: false

Style/CollectionMethods:
  Enabled: true

Style/DoubleNegation:
  Enabled: false

Style/FormatString:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

Style/StringConcatenation:
  Enabled: false
